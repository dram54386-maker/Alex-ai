<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Alex AI</title>
<style>body{margin:0;font-family:Arial;background:#0f1014;color:#fff}header{padding:18px;text-align:center;background:#171923;font-size:22px;font-weight:bold}.wrap{max-width:720px;margin:auto;padding:12px}.chat{height:68vh;overflow:auto;padding:8px}.b{padding:12px 14px;margin:9px 0;border-radius:16px;white-space:pre-wrap}.u{background:#37317a;margin-left:15%}.a{background:#20232d;margin-right:15%}.row{display:flex;gap:8px;position:sticky;bottom:0;background:#0f1014;padding:10px 0}.row input{flex:1;padding:13px;border-radius:14px;border:0;background:#22252f;color:#fff}.row button{border:0;border-radius:14px;padding:0 14px;background:#6c63ff;color:white}.tools{display:flex;gap:7px;margin-bottom:8px}.tools button{padding:7px;border-radius:10px;border:1px solid #444;background:#191b24;color:#ddd}</style></head>
<body><header>✨ Alex AI</header><div class="wrap"><div class="tools"><button onclick="study=!study">📚 Study</button><button onclick="listen()">🎤 Voice</button><button onclick="speakLast()">🔊 Read</button><button onclick="clearChat()">🗑️ Clear</button></div><div id="chat" class="chat"><div class="b a">Hi! I'm Alex. Ask me anything.</div></div><div class="row"><input id="q" placeholder="Message Alex…" onkeydown="if(event.key==='Enter')send()"><button onclick="send()">Send</button></div></div>
<script>let study=false,history=[];const chat=document.getElementById('chat');function add(t,c){let d=document.createElement('div');d.className='b '+c;d.textContent=t;chat.appendChild(d);chat.scrollTop=chat.scrollHeight}async function send(){let q=document.getElementById('q').value.trim();if(!q)return;document.getElementById('q').value='';add(q,'u');history.push({role:'user',content:q});add('Thinking…','a');let last=chat.lastChild;try{let r=await fetch(localStorage.getItem('alexServer')||'https://YOUR-SERVER.example/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:history,studyMode:study})});let j=await r.json();last.textContent=j.reply||j.error||'No reply';history.push({role:'assistant',content:last.textContent})}catch(e){last.textContent='Connect Alex to your private server first. Set the server URL in the app project README.'}}function clearChat(){chat.innerHTML='';history=[];add("Chat cleared. I'm Alex.",'a')}function listen(){let S=window.SpeechRecognition||window.webkitSpeechRecognition;if(!S){alert('Voice input is not supported on this Android WebView.');return}let s=new S();s.lang='en-IN';s.onresult=e=>{document.getElementById('q').value=e.results[0][0].transcript};s.start()}function speakLast(){let a=[...document.querySelectorAll('.a')].pop();if(a)speechSynthesis.speak(new SpeechSynthesisUtterance(a.textContent))}</script></body></html>
